<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard - DumbAssets</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" crossorigin="anonymous" />
</head>
<body>
  <header class="app-header">
    <h1 id="site-title">DumbAssets Dashboard</h1>
    <div class="header-actions">
      <a class="btn" href="/tracking.html?id=demo">Open Demo Tracker</a>
    </div>
  </header>

  <section class="kpi-row" aria-label="Overview KPIs">
    <div class="kpi" id="kpi-total">
      <div class="kpi-value">0</div>
      <div class="kpi-label">Total Shipments</div>
    </div>
    <div class="kpi" id="kpi-active">
      <div class="kpi-value">0</div>
      <div class="kpi-label">Active Now</div>
    </div>
    <div class="kpi" id="kpi-speed">
      <div class="kpi-value">0</div>
      <div class="kpi-label">Avg Speed</div>
    </div>
    <div class="kpi" id="kpi-updated">
      <div class="kpi-value">—</div>
      <div class="kpi-label">Last Update</div>
    </div>
  </section>

  <main class="dashboard-grid">
    <aside class="shipments-panel">
      <h2>Shipments</h2>
      <input id="search" placeholder="Search shipments" />
      <ul id="shipments-list" class="list"></ul>
    </aside>

    <section class="map-panel">
      <div id="map" class="map"></div>
      <div class="detail">
        <h3 id="detail-title">Select a shipment</h3>
        <div id="detail-body">
          <p>Choose a shipment from the left to view live location.</p>
        </div>
        <div class="controls">
          <button id="start-track" class="btn">Start Sim</button>
          <button id="stop-track" class="btn">Stop</button>
          <a id="open-tracker" class="btn" href="#">Open Tracker Page</a>
          <button id="copy-link" class="btn">Copy Link</button>
          <button id="create-share" class="btn">Create Share Link</button>
        </div>
      </div>
    </section>
  </main>

    <!-- Share modal -->
    <div id="share-modal" class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="share-modal-title">
        <h3 id="share-modal-title">Share Link</h3>
        <p id="share-modal-body">Generating...</p>
        <div class="modal-actions">
          <button id="share-copy" class="btn">Copy</button>
          <button id="share-revoke" class="btn">Revoke</button>
          <button id="share-close" class="btn">Close</button>
        </div>
      </div>
    </div>

  <script src="/config.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
