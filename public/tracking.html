<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gold Shipping Tracker</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.20.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body, html { height: 100%; margin: 0; font-family: Arial, Helvetica, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #panel { position: absolute; z-index: 2; left: 10px; top: 10px; background: rgba(255,255,255,0.9); padding: 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="panel">
    <strong>Gold Shipment Tracking</strong>
    <div>Tracking ID: <span id="track-id"></span></div>
    <div>Lat: <span id="lat"></span>, Lng: <span id="lng"></span></div>
    <div>Speed: <span id="speed"></span> km/h</div>
    <button id="start">Start Simulation</button>
    <button id="stop">Stop</button>
  </div>
  <div id="map"></div>
  <script src="/config.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.20.0/mapbox-gl.js"></script>
  <script src="/tracking.js"></script>
</body>
</html>
